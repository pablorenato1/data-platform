version: 2

models:
  - name: stg_objetivos
    description: "Objetivos distintos de stg_base_planejamento (ds_objetivo sem espaços nas pontas)."
    columns:
      - name: id_objetivo
        description: "Chave gerada com dbt_utils.generate_surrogate_key a partir de: municipio, nu_ano_exercicio, objetivo_ordenacao."
      - name: id_diretriz
        description: "Chave gerada com dbt_utils.generate_surrogate_key a partir de: municipio, nu_ano_exercicio, diretriz_ordenacao."
      - name: municipio
      - name: projeto_tipo
      - name: nu_ano_exercicio
      - name: _ingested_at
        description: "Momento da carga na tabela raw (criado pelo notebook de carga)."
      - name: objetivo_ordenacao
      - name: ds_objetivo

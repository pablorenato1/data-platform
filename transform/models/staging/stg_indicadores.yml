version: 2

models:
  - name: stg_indicadores
    description: "Indicadores distintos de stg_base_planejamento."
    columns:
      - name: id_indicador
        description: "Chave gerada com dbt_utils.generate_surrogate_key a partir de: municipio, nu_ano_exercicio, meta_ordenacao, ds_indicador."
      - name: id_meta
        description: "Chave gerada com dbt_utils.generate_surrogate_key a partir de: municipio, nu_ano_exercicio, meta_ordenacao."
      - name: municipio
      - name: projeto_tipo
      - name: nu_ano_exercicio
      - name: _ingested_at
        description: "Momento da carga na tabela raw (criado pelo notebook de carga)."
      - name: ds_indicador
      - name: sg_unidade_indicador
      - name: no_unidade_indicador
      - name: nu_linha_base
        description: "Convertido com TRY_CAST para DOUBLE; valores inválidos viram NULL."
